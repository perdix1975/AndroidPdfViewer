name: Headset diagnostic APK

on:
  push:
    branches:
      - 'temp/headset-diagnostic'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headset-diagnostic
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build diagnostic APK
        run: gradle :sample:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: headset-diagnostic-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          if-no-files-found: error
