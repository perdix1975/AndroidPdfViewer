name: Volume Command Harness

on:
  push:
    branches:
      - temp/volume-command-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and Android compile
        working-directory: harness
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload harness APK
        uses: actions/upload-artifact@v4
        with:
          name: volume-command-harness-apk
          path: harness/build/outputs/apk/debug/*.apk
