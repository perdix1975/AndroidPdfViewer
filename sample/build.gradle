plugins {
    id 'com.android.application'
}

android {
    namespace 'com.github.barteksc.sample'
    compileSdk 35

    defaultConfig {
        applicationId 'gr.kingpool.headsetdiag'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-z3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
